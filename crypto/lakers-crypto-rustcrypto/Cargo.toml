[package]
name = "lakers-crypto-rustcrypto"
version.workspace = true
edition = "2021"
authors = [ "Christian Amsüss <chrysn@fsfe.org>" ]
license.workspace = true
description = "EDHOC crypto library backend based on the RustCrypto crates"
repository.workspace = true
readme.workspace = true

[dependencies]
lakers-shared.workspace = true

aead = { version = "0.5.2", default-features = false }
aes = { version = "0.8.3", default-features = false }
ccm = { version = "0.5.0", default-features = false }
hkdf = { version = "0.12.3", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = [ "ecdh", "ecdsa" ] }
sha2 = { version = "0.10.8", default-features = false }
rand_core = { version = "0.6.4", default-features = false }

# Pinned exactly: libcrux is pre-1.0 and has been shipping breaking changes at
# roughly one release per two months (0.0.7 Feb 2026 -> 0.0.10 Jul 2026).
# `default-features = false` keeps out `std`, `alloc` and the mlkem768/1024
# parameter sets we do not use.
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = [ "mlkem512" ], optional = true }

[features]
default = [ ]

## Post-quantum primitives (ML-KEM, ML-DSA) for draft-papon-lake-pq-edhoc.
##
## This is the only backend that implements them; PSA and CryptoCell310 have no
## underlying support, and take the trait's default `Err` bodies instead.
pq = [ "lakers-shared/pq", "dep:libcrux-ml-kem" ]
