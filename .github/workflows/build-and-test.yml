name: Build and test

on:
  push:
    branches: [main]
    tags: 'v*'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Runners are pinned to ubuntu-24.04 because rust-psa-crypto's bindgen 0.69 generates broken
# bindings with the newer libclang on ubuntu-26.04; go back to ubuntu-latest once rust-psa-crypto is removed.
jobs:
  check-style:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Install Rust formatter
      run: rustup component add rustfmt
    - name: Run cargo check
      run: cargo check --all-features
    - name: Check if code is well formatted
      run: cargo fmt --check

  unit-tests-default:
    needs: check-style
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run unit tests with default features
      run: RUST_BACKTRACE=1 cargo test


  unit-tests:
    needs: check-style
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        crypto_backend: [lakers-crypto/psa, lakers-crypto/rustcrypto]
        ead: [ead-none, ead-authz]
        buffers: [default-buffers, large-buffers]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run unit tests with feature matrix # note that we only add `--package lakers-ead-authz` when testing with that config
      run: RUST_BACKTRACE=1 cargo test -p lakers -p lakers-crypto -p lakers-shared ${{ matrix.ead == 'ead-authz' && '-p lakers-ead-authz' || '' }}  --no-default-features --features="${{ matrix.crypto_backend }}, test-${{ matrix.ead }}${{ matrix.buffers == 'large-buffers' && ', lakers-shared/large_buffers' || '' }}" --no-fail-fast -- --test-threads 1


  build-lake-package:
    needs: unit-tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        crypto_backend: [lakers-crypto/psa, lakers-crypto/psa-baremetal, lakers-crypto/cryptocell310, lakers-crypto/rustcrypto]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install arm targets for Rust
      run: rustup target add thumbv7m-none-eabi && rustup target add thumbv7em-none-eabihf
    - name: Install arm gcc
      run: sudo apt-get -y update && sudo apt-get -y install gcc-arm-none-eabi

    - name: Build
      run: cargo build --package lakers --package lakers-crypto --package lakers-ead-authz --no-default-features --features="${{ matrix.crypto_backend }}" --release

  generate-lean-proofs:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout lakers
      uses: actions/checkout@v4

    - name: Install cargo-hax (prebuilt)
      id: hax-prebuilt
      continue-on-error: true
      run: |
        tmp=$(mktemp -d)
        curl -sSfL -o "$tmp/cargo-hax.tar.zst" \
          https://github.com/cryspen/hax/releases/download/cargo-hax-v0.5.0/cargo-hax-x86_64-unknown-linux-gnu.tar.zst
        echo "c638e631adee70b19c79bf84203e712e2da9233f85df223afc56e66042a24374  $tmp/cargo-hax.tar.zst" | sha256sum -c
        tar --zstd -xf "$tmp/cargo-hax.tar.zst" -C "$tmp"
        "$tmp/cargo-hax" hax --version
        mv "$tmp/cargo-hax" ~/.cargo/bin/

    - name: Install cargo-hax (build from source, fallback)
      if: steps.hax-prebuilt.outcome == 'failure'
      uses: hacspec/hax-actions@main
      with:
        hax_reference: "a045d15a3bf43fe05096146f488668b521a4ae44"

    - name: Check cargo-hax
      run: |
        if [ "${{ steps.hax-prebuilt.outcome }}" = failure ]; then
          echo "::warning::prebuilt cargo-hax failed, built from source instead"
        fi
        cargo hax --version

    - name: Extract lakers-shared into Lean
      run: |
        cargo hax -C --manifest-path shared/Cargo.toml \; into lean --charon-args="--start-from crate::buffer"

    - name: Check the committed extraction is up to date
      run: |
        git status --porcelain shared/proofs/lean
        git diff --exit-code shared/proofs/lean
        test -z "$(git status --porcelain shared/proofs/lean)"

    - name: Build the Lean proofs
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: shared/proofs/lean
        build-args: "--wfail"

    - name: Check every proof obligation is proven
      run: shared/proofs/lean/check-obligations.sh
  
  build-lakers-c:
    needs: unit-tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        crypto_backend: [crypto-rustcrypto, crypto-psa-baremetal, crypto-cryptocell310]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install arm targets for Rust
      run: rustup target add thumbv7em-none-eabihf
    - name: Install arm gcc and cbindgen
      run: sudo apt-get -y update && sudo apt-get -y install gcc-arm-none-eabi cbindgen

    - name: Build static library, generate headers, and zip to file
      run: cd lakers-c && ./build.sh "${{ matrix.crypto_backend }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: lakers-c-${{ matrix.crypto_backend }}
        path: ./target/lakers-c-*.zip


  build-lakers-c-example:
    needs: unit-tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Checkout libcoap
      uses: actions/checkout@v4
      with:
        repository: obgm/libcoap
        path: libcoap

    - name: Install libcoap
      run: |
        cd libcoap && ./autogen.sh
        ./configure --disable-doxygen --disable-manpages --disable-dtls --disable-oscore
        make && sudo make install

    - name: Install arm targets for Rust
      run: rustup target add thumbv7em-none-eabihf
    - name: Install arm gcc and cbindgen
      run: sudo apt-get -y update && sudo apt-get -y install gcc-arm-none-eabi cbindgen

    - name: Build static library and generate headers
      run: cd lakers-c && ./build.sh crypto-rustcrypto

    - name: Build and run native C eaxmple
      run: |
        cd examples/lakers-c-native
        make all LAKERS_EAD=authz


  test-lakers-python:
    needs: check-style
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Test Python package
      run: |
        cd lakers-python
        python3 -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install -U maturin pytest cbor2
        pip freeze
        maturin develop && pytest


  run-example-on-qemu:
    needs: unit-tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        crypto_backend: [crypto-psa]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install arm targets for Rust
      run: rustup target add thumbv7m-none-eabi
    - name: Install arm gcc
      run: sudo apt-get -y update && sudo apt-get -y install gcc-arm-none-eabi
    - name: Install QEMU ARM emulator
      run: sudo apt-get -y install qemu-system-arm

    - name: Run tests in QEMU
      run: cd examples/lakers-no_std && cargo run --target="thumbv7m-none-eabi" --no-default-features --features="${{ matrix.crypto_backend }}" --release


  build-example-for-cortex-m4:
    needs: unit-tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        crypto_backend: [crypto-psa, crypto-cryptocell310]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install arm targets for Rust
      run: rustup target add thumbv7em-none-eabihf
    - name: Install arm gcc
      run: sudo apt-get -y update && sudo apt-get -y install gcc-arm-none-eabi

    - name: Build example
      run: cd examples/lakers-no_std && cargo build --target="thumbv7em-none-eabihf" --no-default-features --features="${{ matrix.crypto_backend }}, rtt" --release


  build-coap-example:
    needs: unit-tests
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Build server
      run: cargo build --bin coapserver

    - name: Build client
      run: cargo build --bin coapclient

    - name: Build coap-handler based server
      run: cargo build --bin coapserver-coaphandler


  release:
    runs-on: ubuntu-24.04
    needs: [
      build-lake-package, build-lakers-c,
      build-example-for-cortex-m4, build-coap-example, build-lakers-c-example,
      run-example-on-qemu,
    ]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.ref, 'refs/tags')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          pattern: lakers-c*
          path: ./release-artifacts
          merge-multiple: true
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: "release-artifacts/*"
          token: ${{ secrets.RELEASE_TOKEN }}
