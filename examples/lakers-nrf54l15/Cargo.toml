[package]
name = "lakers-nrf54l15"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lakers = { package = "lakers", path = "../../lib" }
lakers-shared = { path = "../../shared" }
# The hardware-accelerated backend, selected via the lakers-crypto dispatch feature.
lakers-crypto = { path = "../../crypto", default-features = false, features = ["nrf54l15"] }

# Needed to construct the hardware Cal from PAC peripherals (there is no `default_crypto()` for
# hardware backends).
# embedded-cal-nrf54l15 = { path = "../../../embedded-cal/embedded-cal-nrf54l15" }
# embedded-cal-software-demo = { path = "../../../embedded-cal/embedded-cal-software-demo" }

embedded-cal-nrf54l15 = { git = "https://github.com/lake-rs/embedded-cal" }
embedded-cal-software-demo = { git = "https://github.com/lake-rs/embedded-cal" }

nrf-pac = { version = "0.2.0", features = ["nrf54l15-app", "rt"] }

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.2"
hexlit = "0.5.3"
# defmt 1.0 to match probe-rs 0.30 / embedded-cal (a defmt 0.3 binary decodes to no output there).
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
