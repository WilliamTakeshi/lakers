# Runner + target for flashing to an STM32WBA55 board over a probe (mirrors
# embedded-cal-stm32wba55's setup).

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = ["probe-rs", "run", "--chip", "STM32WBA55CG", "--log-format=oneline", "--allow-erase-all", "--verify"]

rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"
