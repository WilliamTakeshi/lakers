[workspace]

members = [
  "lib",
  "ead/lakers-ead-authz",
  "crypto",
  "crypto/lakers-crypto-psa",
  "crypto/lakers-crypto-cryptocell310-sys",
  "crypto/lakers-crypto-embedded-cal",
  "examples/coap",
  "examples/lakers-no_std",
  "examples/lakers-nrf52840",
  "examples/lakers-nrf54l15",
  "lakers-c",
  "lakers-python",
]

# reduced "default-members", should include only packages that can be built and
# tested on the host architecture
default-members = [
  "lib",
  "crypto",
  "examples/coap",
]

# according to https://doc.rust-lang.org/edition-guide/rust-2021/default-cargo-resolver.html,
# this needs to be explicitly set if using virtual manifests (like this).
# We need this so dependency crates use it *in all cases*.
# Specifically, `psa-crypto` merges build-dependency and regular dependency
# features without this, causing forced "std" in downstream crate.
resolver = "2"

[workspace.package]
version = "0.9.0"
repository = "https://github.com/lake-rs/lakers/"
license = "BSD-3-Clause"
readme = "shared/README.md"
keywords = ["iot", "security", "protocol", "crypto", "lake"]
categories = [ "no-std::no-alloc", "network-programming", "embedded" ]

[workspace.dependencies]

lakers-shared = { package = "lakers-shared", path = "shared/", version = "^0.9.0" }

lakers-ead-authz = { package = "lakers-ead-authz", path = "ead/lakers-ead-authz/", version = "^0.9.0" }

lakers-crypto = { path = "crypto/" }
lakers-crypto-cryptocell310 = { path = "crypto/lakers-crypto-cryptocell310-sys/" }
lakers-crypto-psa = { path = "crypto/lakers-crypto-psa/" }
lakers-crypto-embedded-cal = { package = "lakers-crypto-embedded-cal", path = "crypto/lakers-crypto-embedded-cal/" }

lakers = { package = "lakers", path = "lib/", version = "^0.9.0", default-features = false }

# FIXME: go back to lake-rs/embedded-cal when the cryptocell branch is merged (lake-rs/embedded-cal#157)
embedded-cal = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }
embedded-cal-cryptocell = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }
embedded-cal-nrf54l15 = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }
embedded-cal-rand = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }
embedded-cal-rustcrypto = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }
embedded-cal-software-demo = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }
embedded-cal-stm32wba55 = { git = "https://github.com/malishav/embedded-cal", branch = "cryptocell" }

# Beware that those two lines are mogrified in CI so that hax can find the proof-libs through the git path:
hax-lib = { version = "0.3.1", default-features = false, features = ["macros"] }
# to get proof-libs: hax-lib = { git = "https://github.com/cryspen/hax", default-features = false, features = ["macros"] }

[patch.crates-io]
psa-crypto = { git = "https://github.com/malishav/rust-psa-crypto", branch = "baremetal" }
