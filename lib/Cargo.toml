[package]
name = "lakers"
version.workspace = true
edition = "2021"
authors = ["Mališa Vučinić <malisa.vucinic@inria.fr>"]
license.workspace = true
description = "An implementation of EDHOC (RFC 9528)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
lakers-shared.workspace = true

defmt-or-log = { version = "0.2.1", default-features = false }
log = { version = "0.4", optional = true }
defmt = { version = "0.3", optional = true }
digest = { version = "0.10.7", default-features = false }

[dev-dependencies]
lakers-ead-authz = { workspace = true }
lakers-crypto.workspace = true
hexlit = "0.5.3"

[features]
# NOTE: the ead features are just needed for multiplexing tests
default = [ "test-ead-none" ]
test-ead-none = [ ]
test-ead-authz = [ ]
defmt = ["dep:defmt"]
log = ["dep:log"]
large_buffers = [ "lakers-shared/large_buffers" ]
pq_buffers = [ "lakers-shared/pq_buffers" ]

## Post-quantum EDHOC, per draft-papon-lake-pq-edhoc.
##
## Experimental, and not interoperable: the draft assigns no method code points or
## cipher suites, so everything behind this flag uses locally-chosen values.
##
## Selects `pq_buffers` separately -- this flag only turns the code on, it does not
## make the messages fit. A PQ handshake needs both.
##
## lakers-crypto is a dev-dependency, so this reaches the backend for the test build
## only; a downstream consumer picks its own backend and enables `pq` on it directly.
pq = [ "lakers-shared/pq", "lakers-crypto/pq" ]

[lib]
crate-type = ["rlib"]
