[package]
name = "lakers-shared"
version.workspace = true
edition = "2021"
authors = ["Mališa Vučinić <malisa.vucinic@inria.fr>"]
license.workspace = true
description = "EDHOC crypto library constants crate"
repository.workspace = true
# It's implied, but still better for consistency to have it explicit.
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
hex = { version = "0.4.3", optional = true }
defmt-or-log = { version = "0.2.1", default-features = false }
log = { version = "0.4", optional = true }
defmt = { version = "0.3", optional = true }
hax-lib.workspace = true
digest = { version = "0.10.7", default-features = false }

[dev-dependencies]
hexlit = "0.5.3"
rstest = "0.21.0"

[features]
default = [  ]
python-bindings = ["pyo3", "hex"]

## Post-quantum EDHOC, per draft-papon-lake-pq-edhoc.
##
## Gates the ML-KEM and ML-DSA additions to the `Crypto` trait, the PQ credential
## and suite variants, and the PQ `EDHOCMethod` values. Experimental: the draft
## assigns no method code points or cipher suites, so everything behind this flag
## uses locally-chosen values and is not interoperable.
##
## Orthogonal to `pq_buffers`, which sizes the buffers. A PQ handshake needs both.
pq = []

## For all arbitrarily limited buffers, pick the maximum.
##
## This provides an easy way to allow unconstrained systems to stomach larger
## sizes (especially for experimentation).
large_buffers = [
    "max_message_size_len_1024",
    "max_kdf_content_len_1024",
    "max_buffer_len_1024",
    "max_ead_len_1024",
    "max_connid_encoded_len_24",
]

## Buffers big enough for post-quantum EDHOC.
##
## An ML-KEM-512 ciphertext is 768 bytes and an ML-DSA-44 signature 2420, so a
## draft-papon-lake-pq-edhoc message_2 or message_3 runs to roughly 3.2 kB --
## past every rung `large_buffers` selects. Host-side only: `EdhocBuffer<N>` is
## a by-value `[u8; N]`, so this costs several kB of stack per live exchange.
## Post-quantum message sizes.
##
## `max_ead_len_1024` rather than 4096 on purpose: nothing in draft-papon-lake-pq-edhoc §3
## makes EADs bigger, and `EadItems` holds `MAX_EAD_ITEMS` of them inline. At the 4096 rung it
## alone is 16 kB, which every protocol state carries and the typestate chain copies -- enough
## to overflow the stack in tests that drive more than one handshake.
pq_buffers = [
    "max_message_size_len_4096",
    "max_kdf_content_len_4096",
    "max_buffer_len_4096",
    "max_ead_len_1024",
    "max_cred_len_4096",
    "max_connid_encoded_len_24",
]

## Precise control of `MAX_MESSAGE_SIZE_LEN`.
##
## If any of those is set, they override the default of 192. If multiple are
## set, the highest wins.

max_message_size_len_256 = []
max_message_size_len_320 = []
max_message_size_len_384 = []
max_message_size_len_448 = []
max_message_size_len_512 = []
max_message_size_len_1024 = []
max_message_size_len_4096 = []

## Precise control of `MAX_KDF_CONTENT_LEN`.
##
## If any of those is set, they override the default of 256. If multiple are
## set, the highest wins.

max_kdf_content_len_320 = []
max_kdf_content_len_384 = []
max_kdf_content_len_448 = []
max_kdf_content_len_512 = []
max_kdf_content_len_1024 = []
max_kdf_content_len_4096 = []

## Precise control of `MAX_BUFFER_LEN`.
##
## If any of those is set, they override the default of 320. If multiple are
## set, the highest wins.

max_buffer_len_384 = []
max_buffer_len_448 = []
max_buffer_len_512 = []
max_buffer_len_1024 = []
max_buffer_len_4096 = []

## Precise control of `MAX_EAD_LEN`.
##
## If any of those is set, they override the default of 64. If multiple are
## set, the highest wins.

max_ead_len_128 = []
max_ead_len_192 = []
max_ead_len_256 = []
max_ead_len_384 = []
max_ead_len_512 = []
max_ead_len_768 = []
max_ead_len_1024 = []
max_ead_len_4096 = []

## Control of `MAX_CRED_LEN`.
##
## If this is not set, the default of 192 bytes is used, which suits a P-256 CCS
## but not a post-quantum credential.

max_cred_len_4096 = []

## Control of `MAX_CONNID_ENCODED_LEN`.
##
## If this is not set, the minimum sensible default (8 bytes) is used.

max_connid_encoded_len_24 = []
